<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HME Alerts" />
  <link rel="manifest" href="/kasselmann-hme-alerts/manifest.json" />
  <title>Kasselmann HME Alerts</title>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f7f7;color:#111}.page{min-height:100vh;display:flex;justify-content:center;padding:40px 18px}.container{width:100%;max-width:560px;text-align:center}.icon{width:62px;height:62px;background:#111;color:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 22px;font-size:30px}h1{margin:0;font-size:30px}.subtitle{margin:8px 0 28px;color:#666;font-size:17px}.store-box{text-align:left}.store-box>label{display:block;font-weight:700;margin-bottom:10px}.store-list{background:#fff;border:1px solid #ccc;border-radius:10px;padding:8px 14px}.store-option{display:flex;gap:12px;align-items:center;padding:11px 2px;border-bottom:1px solid #eee;font-size:17px}.store-option:last-child{border-bottom:0}.store-option input{width:20px;height:20px}button{width:100%;border-radius:8px;font-weight:700;font-size:16px;cursor:pointer}#saveStoreButton{margin-top:12px;padding:14px;border:1px solid #171719;background:#fff;color:#171719}#enableButton{margin-top:18px;padding:20px;border:0;background:#171719;color:#fff;font-size:18px}button:disabled{opacity:.6;cursor:default}.description{margin:24px auto 34px;line-height:1.5;color:#666}.status{margin-top:22px;border:1px solid #ddd;background:#fff;border-radius:10px;padding:18px;text-align:left}.status-label{font-size:12px;color:#777;text-transform:uppercase}.status-title{font-size:18px;font-weight:700;margin-top:5px}.status-detail{margin-top:6px;color:#666;font-size:14px;word-break:break-word}.success{border-color:#6bbf73;background:#f4fff5}.error{border-color:#e6a199;background:#fff5f3}
  </style>
</head>
<body>
<div class="page"><main class="container">
  <div class="icon">🔔</div>
  <h1>Kasselmann HME Alerts</h1>
  <div class="subtitle">Drive-Thru Performance Notifications</div>

  <div class="store-box">
    <label>Select the locations this device should receive alerts for</label>
    <div class="store-list" id="storeList">
      <label class="store-option"><input type="checkbox" value="pendleton"> Pendleton</label>
      <label class="store-option"><input type="checkbox" value="eminence"> Eminence</label>
      <label class="store-option"><input type="checkbox" value="lagrange"> LaGrange</label>
      <label class="store-option"><input type="checkbox" value="hanover"> Hanover</label>
      <label class="store-option"><input type="checkbox" value="madison"> Madison</label>
      <label class="store-option"><input type="checkbox" value="clarksville"> Clarksville</label>
      <label class="store-option"><input type="checkbox" value="buckner"> Buckner</label>
      <label class="store-option"><input type="checkbox" value="veterans"> Veterans</label>
    </div>
    <button id="saveStoreButton" disabled>Save Locations for This Device</button>
  </div>

  <button id="enableButton" disabled>Loading Notification Service…</button>
  <div class="description">Alerts are sent when a selected location's Current Hour Average remains at or above <strong>250 seconds for 5 minutes</strong>.</div>

  <div id="statusBox" class="status">
    <div class="status-label">Notification Status</div>
    <div id="statusText" class="status-title">Initializing…</div>
    <div id="statusDetail" class="status-detail">Connecting to the notification service.</div>
  </div>
</main></div>

<script>
const APP_ID = "48b2684c-c9e3-466c-afe5-24779f7b2096";
const STORES = {
  pendleton:"Pendleton", eminence:"Eminence", lagrange:"LaGrange", hanover:"Hanover",
  madison:"Madison", clarksville:"Clarksville", buckner:"Buckner", veterans:"Veterans"
};
const GROUP_A = ["pendleton","eminence","lagrange","hanover"];
const GROUP_B = ["madison","clarksville","buckner","veterans"];
const OLD_TAGS = Object.keys(STORES).map(code => "hme_store_" + code);

const enableButton = document.getElementById("enableButton");
const saveStoreButton = document.getElementById("saveStoreButton");
const statusBox = document.getElementById("statusBox");
const statusText = document.getElementById("statusText");
const statusDetail = document.getElementById("statusDetail");
const checkboxes = [...document.querySelectorAll('#storeList input[type="checkbox"]')];
let OneSignalInstance = null;
let ready = false;
let saving = false;

function selectedStores(){ return checkboxes.filter(c=>c.checked).map(c=>c.value); }
function selectedLabels(){ return selectedStores().map(s=>STORES[s]).join(", "); }
function maskFor(group, selected){ return group.reduce((mask,code,i)=> selected.includes(code) ? mask | (1<<i) : mask, 0); }
function showStatus(title,detail,type=""){
  statusText.textContent=title; statusDetail.textContent=detail;
  statusBox.classList.remove("success","error"); if(type) statusBox.classList.add(type);
}
function isIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1); }
function isStandalone(){ return matchMedia("(display-mode: standalone)").matches || navigator.standalone===true; }

let saved=[];
try{ saved=JSON.parse(localStorage.getItem("hme_stores")||"[]"); }catch(e){}
if(!saved.length){ const old=localStorage.getItem("hme_store"); if(old) saved=[old]; }
checkboxes.forEach(c=>c.checked=saved.includes(c.value));
checkboxes.forEach(c=>c.addEventListener("change",()=>{
  saveStoreButton.disabled=!ready || !selectedStores().length;
  saveStoreButton.textContent="Save Locations for This Device";
}));

async function waitForSubscription(timeout=10000){
  const start=Date.now();
  while(Date.now()-start<timeout){
    const sub=OneSignalInstance?.User?.PushSubscription;
    if(sub?.id && sub?.optedIn) return sub.id;
    await new Promise(r=>setTimeout(r,400));
  }
  return null;
}

async function saveLocationTags(showMessage=true){
  if(saving) return false;
  const stores=selectedStores();
  if(!stores.length){ if(showMessage) showStatus("Select a Location","Choose at least one location.","error"); return false; }
  if(!OneSignalInstance) return false;
  const subscriptionId=await waitForSubscription();
  if(!subscriptionId){ if(showMessage) showStatus("Enable Notifications First","Enable HME Alerts, then save your locations.","error"); return false; }

  saving=true;
  saveStoreButton.disabled=true;
  saveStoreButton.textContent="Saving Locations…";
  try{
    // OneSignal Free allows only two data tags per user. Encode all 8 store choices
    // into two 4-bit masks so multi-store selection still works on the Free plan.
    OneSignalInstance.User.removeTags(OLD_TAGS);
    await new Promise(r=>setTimeout(r,700));
    const tags={
      hme_group_a:String(maskFor(GROUP_A,stores)),
      hme_group_b:String(maskFor(GROUP_B,stores))
    };
    OneSignalInstance.User.addTags(tags);
    localStorage.setItem("hme_stores",JSON.stringify(stores));
    localStorage.removeItem("hme_store");
    await new Promise(r=>setTimeout(r,1800));

    const current=OneSignalInstance.User.getTags ? OneSignalInstance.User.getTags() : {};
    const ok=String(current.hme_group_a)===tags.hme_group_a && String(current.hme_group_b)===tags.hme_group_b;
    saveStoreButton.textContent=ok ? "✓ Locations Saved" : "✓ Locations Sent";
    if(showMessage) showStatus(ok?"Locations Assigned":"Locations Sent", "This device is assigned to: "+selectedLabels()+".", "success");
    return true;
  }catch(err){
    console.error(err);
    saveStoreButton.textContent="Save Locations for This Device";
    if(showMessage) showStatus("Unable to Save Locations",err?.message||String(err),"error");
    return false;
  }finally{
    saving=false;
    saveStoreButton.disabled=!ready || !selectedStores().length;
  }
}
saveStoreButton.addEventListener("click",()=>saveLocationTags(true));

if(isIOS() && !isStandalone()){
  enableButton.textContent="Add to Home Screen First";
  showStatus("iPhone Setup Required","Open this page in Safari, tap Share, choose Add to Home Screen, then open HME Alerts from the Home Screen.");
}

window.OneSignalDeferred=window.OneSignalDeferred||[];
OneSignalDeferred.push(async function(OneSignal){
  OneSignalInstance=OneSignal;
  try{
    await OneSignal.init({
      appId:APP_ID,
      serviceWorkerPath:"/kasselmann-hme-alerts/OneSignalSDKWorker.js",
      serviceWorkerParam:{scope:"/kasselmann-hme-alerts/"},
      notifyButton:{enable:false}
    });
    ready=true;
    saveStoreButton.disabled=!selectedStores().length;
  }catch(err){
    enableButton.textContent="Notification Setup Error";
    showStatus("Setup Error",err?.message||String(err),"error");
    return;
  }

  function updateState(){
    const sub=OneSignal.User.PushSubscription;
    if(sub.optedIn && sub.id){
      enableButton.textContent="✓ HME Alerts Enabled";
      enableButton.disabled=true;
      showStatus("HME Alerts Enabled", selectedStores().length ? "Registered for: "+selectedLabels()+"." : "Select and save at least one location.", "success");
    }else{
      enableButton.textContent="🔔 Enable HME Alerts";
      enableButton.disabled=false;
      showStatus("Not Enabled","Select locations, then enable notifications.");
    }
  }

  OneSignal.User.PushSubscription.addEventListener("change",async()=>{
    updateState();
    if(OneSignal.User.PushSubscription.optedIn && selectedStores().length) await saveLocationTags(false);
  });
  updateState();

  if(OneSignal.User.PushSubscription.optedIn && OneSignal.User.PushSubscription.id && selectedStores().length){
    await saveLocationTags(false);
    updateState();
  }

  enableButton.addEventListener("click",async()=>{
    if(!selectedStores().length){ showStatus("Select a Location First","Choose at least one location.","error"); return; }
    enableButton.disabled=true; enableButton.textContent="Enabling…";
    try{
      if(!OneSignal.Notifications.permission) await OneSignal.Notifications.requestPermission();
      await OneSignal.User.PushSubscription.optIn();
      await waitForSubscription();
      await saveLocationTags(true);
      updateState();
    }catch(err){
      enableButton.disabled=false; enableButton.textContent="🔔 Try Again";
      showStatus("Unable to Enable Alerts",err?.message||String(err),"error");
    }
  });
});
</script>
</body>
</html>
