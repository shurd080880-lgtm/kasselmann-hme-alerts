name: HME Alert Monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    paths:
      - "hme_monitor.py"
      - ".github/workflows/hme-alert-monitor.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hme-alert-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check HME continuously and send alerts
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: python hme_monitor.py

      - name: Save alert state
        if: always()
        run: |
          if git diff --quiet -- hme-alert-state.json; then
            echo "No state change to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hme-alert-state.json
          git commit -m "Update HME alert state"
          git push
